source:
  type: "database"
  transformation : ["Y","sql"]
  table: "[bronze].[Customer_bronze]"
  env: "qa"
  exclude_cols: ['SourceFileName','InsertDate']
target:
  type: "database"
  transformation : ["N","NA"]
  table: "[silver].[Customer_Clean]"
  env: "qa"
  exclude_cols: ['SourceFileName','InsertDate']
validation:
  key_columns: ['CustomerID']
  primary_keys: ['CustomerID']
  unique_cols: ['CustomerID', 'Email']
  not_null_cols: ['CustomerID', 'PhoneNumber']
  regex_pattern_col: ['name','[a-zA-Z]']
  range_col: ['CustomerID', 10,100]

